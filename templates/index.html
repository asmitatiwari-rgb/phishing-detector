<!DOCTYPE html>
<html>
<head>
    <title>Phishing Website Detector</title>
    <style>
        body {
            font-family: Arial;
            background: #0f172a;
            color: white;
            text-align: center;
            padding-top: 80px;
        }

        input {
            width: 400px;
            padding: 12px;
            border-radius: 8px;
            border: none;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #22c55e;
            color: white;
            cursor: pointer;
            margin-left: 10px;
        }

        .result {
            margin-top: 30px;
            font-size: 22px;
        }
    </style>
</head>

<body>

<h1>🔥 AI Phishing Website Detector</h1>

<input type="text" id="url" placeholder="Enter website URL">
<button onclick="check()">Check</button>

<div class="result" id="result"></div>

<script>
function check() {
    let url = document.getElementById("url").value;

    fetch("http://127.0.0.1:5000/predict", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ URL: url })
    })
    .then(response => response.json())
    .then(data => {
        console.log(data);  // 👈 debugging

        document.getElementById("result").innerHTML =
            "Result: " + (data.result || "No response");
    })
    .catch(error => {
        document.getElementById("result").innerHTML =
            "Error connecting to server";
    });
}
</script>

</body>
</html>
